---
- hosts: all

  tasks:
    - name: create deployment directory
      file:
        path: "{{ deploy_folder }}/{{ namespace }}"
        state: directory
        mode: '0755'

    - name: create manifest yml
      template:
        src: template/{{ app_name }}-k8s.yml.j2
        dest: "{{ deploy_folder }}/{{ namespace }}/{{ app_name }}-manifest.yml"

#    comment out: install manually for each host
#    - name: Install kubernetes Python library
#      pip:
#        name: kubernetes
#        state: present

    - name: create k8s namespace
      k8s:
        api_version: v1
        kubeconfig: "{{ kubeconfig }}"
        definition:
          kind: Namespace
          metadata:
            name: "{{ namespace }}"

    - name: set k8s secret
      k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        kind: Secret
        name: "{{ app_name }}-secrets"
        namespace: "{{ namespace }}"
        inline:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ app_name }}-secrets"
            namespace: "{{ namespace }}"
          stringData:
            ApiKeyMiddlewareOptions__ApiKeys: "{{ APIKEYMIDDLEWAREOPTIONS__APIKEYS }}"
            ReplicateAiServiceOptions__Token: "{{ ReplicateAiServiceOptions__Token }}"
            LocalAiImageServiceOptions__BaseUrl: "{{ localai_url }}"
            LocalAiImageServiceOptions__ApiKey: "{{ localai_api_key }}"
          data:
            GOOGLE_APPLICATION_CREDENTIALS_JSON: "{{ GOOGLE_APPLICATION_CREDENTIALS_JSON }}"

    - name: apply k8s manifest
      k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        namespace: "{{ namespace }}"
        src: "{{ deploy_folder }}/{{ namespace }}/{{ app_name }}-manifest.yml"

    - name: check new pod are running
      shell: kubectl get pods -l app={{ app_name }} -n={{ namespace }} -o jsonpath='{range .items[*]}{.spec.containers[].image}{"\n"}{end}' | grep {{ app_name }}:{{ docker_image_tag }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: pod_check
      until: pod_check.rc == 0
      retries: 10
      delay: 30

    - name: remove retired admin site and pending-verify volume
      k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        namespace: "{{ namespace }}"
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        wait: true
      loop:
        - { api_version: apps/v1, kind: Deployment, name: angular-admin }
        - { api_version: v1, kind: Service, name: angular-admin-service }
        - { api_version: networking.k8s.io/v1, kind: Ingress, name: angular-admin-ingress }
        - { api_version: traefik.io/v1alpha1, kind: Middleware, name: angular-admin-prefix-remover }
        - { api_version: v1, kind: Secret, name: angular-admin-tls }
        - { api_version: v1, kind: PersistentVolumeClaim, name: "{{ app_name }}-pvc" }

    - name: verify server is started
      tags: verify
      include_tasks: tasks/verify_server_started.yml

    - name: verify image generate
      tags: verify-uat
      include_tasks: tasks/verify_image_generate.yml